{% extends "base.html" %}

{% block title %}Sign In - Academic Portal{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 220px); padding: 1rem 0;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg), 0 0 35px rgba(99, 102, 241, 0.15); border-color: var(--border-accent);">
        <!-- Card Header -->
        <div class="card-header" style="flex-direction: column; align-items: center; text-align: center; gap: 0.5rem; padding: 2rem 1.5rem 1.25rem;">
            <div class="brand-icon" style="width: 48px; height: 48px; margin-bottom: 0.5rem;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </svg>
            </div>
            <h1 style="font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin: 0;">Portal Authentication</h1>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">
                Enter your institutional credentials to access student results and analytics.
            </p>
        </div>

        <!-- Card Body / Form -->
        <div class="card-body" style="padding: 1.5rem 2rem 2rem;">
            <form method="POST" action="{{ url_for('auth.login', next=next) }}" id="loginForm">
                <!-- Username Input -->
                <div class="form-group" style="margin-bottom: 1.25rem;">
                    <label class="form-label" for="username" style="display: block; font-size: 0.825rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">
                        Username or Enrollment No
                    </label>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" class="form-control" required autofocus
                               placeholder="e.g. admin or teacher1" value="{{ username or '' }}"
                               style="width: 100%; padding: 0.7rem 0.85rem 0.7rem 2.5rem; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-main); font-size: 0.9rem;">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label" for="password" style="display: block; font-size: 0.825rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">
                        Password
                    </label>
                    <div style="position: relative;">
                        <span style="position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--text-dim);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-control" required
                               placeholder="••••••••••••"
                               style="width: 100%; padding: 0.7rem 2.5rem 0.7rem 2.5rem; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); color: var(--text-main); font-size: 0.9rem;">
                        <button type="button" id="togglePasswordBtn" aria-label="Toggle Password Visibility"
                                style="position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 2px;">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 0.95rem; justify-content: center;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Sign In to Portal
                </button>
            </form>

            <!-- Quick Demo Credentials Selector -->
            <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle);">
                <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 0.65rem; text-align: center;">
                    Quick Demo Credentials
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.4rem;">
                    <button type="button" class="btn btn-secondary btn-sm demo-fill-btn" data-user="admin" data-pass="Admin@12345" style="justify-content: space-between; font-size: 0.8rem;">
                        <span><strong style="color: var(--color-primary);">Admin:</strong> <code>admin</code></span>
                        <span class="badge badge-primary">Full Control</span>
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm demo-fill-btn" data-user="teacher1" data-pass="Teacher@12345" style="justify-content: space-between; font-size: 0.8rem;">
                        <span><strong style="color: var(--color-secondary);">Teacher:</strong> <code>teacher1</code></span>
                        <span class="badge badge-info">Marks & Analytics</span>
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm demo-fill-btn" data-user="student1" data-pass="Student@12345" style="justify-content: space-between; font-size: 0.8rem;">
                        <span><strong style="color: var(--color-success);">Student:</strong> <code>student1</code></span>
                        <span class="badge badge-success">Read Only</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Quick autofill for demo buttons
    document.querySelectorAll('.demo-fill-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const user = btn.getAttribute('data-user');
            const pass = btn.getAttribute('data-pass');
            const userInput = document.getElementById('username');
            const passInput = document.getElementById('password');
            if (userInput && passInput) {
                userInput.value = user;
                passInput.value = pass;
                userInput.focus();
            }
        });
    });

    // Password visibility toggle
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.style.color = isPassword ? 'var(--color-primary)' : 'var(--text-dim)';
        });
    }
</script>
{% endblock %}
